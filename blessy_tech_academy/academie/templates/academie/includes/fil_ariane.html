<!-- ================================================
     INCLUDES/FIL_ARIANE.HTML — Breadcrumb réutilisable + Schema.org
     Usage : {% include 'academie/includes/fil_ariane.html' with etapes=liste_etapes %}
     où liste_etapes = [{'nom': 'Formations', 'url': '/formations/'}, {'nom': 'Python', 'url': None}]
     ================================================ -->
<nav aria-label="Fil d'Ariane" style="max-width:1100px; margin:0 auto; padding:16px 40px; font-size:13px; color:#a0aec0;">
    <a href="/" style="color:#a0aec0; text-decoration:none;">Accueil</a>
    {% for etape in etapes %}
    <span style="margin:0 6px;">/</span>
    {% if etape.url %}
    <a href="{{ etape.url }}" style="color:#a0aec0; text-decoration:none;">{{ etape.nom }}</a>
    {% else %}
    <span style="color:#003B8E; font-weight:600;">{{ etape.nom }}</span>
    {% endif %}
    {% endfor %}
</nav>

<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Accueil", "item": "{{ request.scheme }}://{{ request.get_host }}/"}
        {% for etape in etapes %}
        ,{"@type": "ListItem", "position": {{ forloop.counter|add:"1" }}, "name": "{{ etape.nom|escapejs }}"{% if etape.url %}, "item": "{{ request.scheme }}://{{ request.get_host }}{{ etape.url }}"{% endif %}}
        {% endfor %}
    ]
}
</script>
