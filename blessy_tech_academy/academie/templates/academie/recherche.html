<!-- ================================================
     RECHERCHE.HTML — Filtres avancés (insérer après le <h1> existant)
     ================================================ -->
<form method="GET" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; padding:16px; background:var(--gris-clair); border-radius:12px;">
    <input type="text" name="q" value="{{ terme }}" placeholder="Rechercher..." style="flex:1; min-width:200px; padding:10px; border:1.5px solid #e2e8f0; border-radius:8px;">
    <select name="ecole" style="padding:10px; border:1.5px solid #e2e8f0; border-radius:8px;">
        <option value="">Toutes les écoles</option>
        {% for e in ecoles %}<option value="{{ e.id }}" {% if ecole_filtre == e.id|stringformat:"s" %}selected{% endif %}>{{ e.nom }}</option>{% endfor %}
    </select>
    <select name="niveau" style="padding:10px; border:1.5px solid #e2e8f0; border-radius:8px;">
        <option value="">Tous niveaux</option>
        <option value="debutant" {% if niveau_filtre == 'debutant' %}selected{% endif %}>Débutant</option>
        <option value="intermediaire" {% if niveau_filtre == 'intermediaire' %}selected{% endif %}>Intermédiaire</option>
        <option value="avance" {% if niveau_filtre == 'avance' %}selected{% endif %}>Avancé</option>
    </select>
    <label style="display:flex; align-items:center; gap:6px; font-size:13px;">
        <input type="checkbox" name="gratuit" value="1" {% if gratuit_filtre %}checked{% endif %}> Gratuit seulement
    </label>
    <button type="submit" style="padding:10px 20px; background:#003B8E; color:white; border:none; border-radius:8px; font-weight:700;">Filtrer</button>
</form>
